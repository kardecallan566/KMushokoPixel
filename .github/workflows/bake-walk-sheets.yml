name: CP03D Bake Unified Walk Sprite Sheets
on:
  push:
    branches:
      - dev/checkpoint-03d-facing-walk-consistency
    paths:
      - 'tools/build_hero_reference_art.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Replace inconsistent walk poses with unified sprite sheets
        run: |
          python tools/build_hero_reference_art.py
          git rm -r assets/characters/source/walk3
          git add assets/characters/*.png
          git diff --cached --stat
      - name: Commit generated binary sprites to the same feature branch
        run: |
          if git diff --cached --quiet; then
            echo "No sprite changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "art(cp03d): regenerate consistent walk frames and discard mismatched source pose"
          git push origin HEAD:dev/checkpoint-03d-facing-walk-consistency
