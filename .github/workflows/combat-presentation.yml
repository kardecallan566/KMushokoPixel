name: CP03 Combat Presentation
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/test_boss_mechanics.gd'
      - 'project.godot'
      - '.github/workflows/combat-presentation.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/test_boss_mechanics.gd'
      - 'project.godot'
      - '.github/workflows/combat-presentation.yml'
permissions:
  contents: read
jobs:
  godot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot_version: ['4.5.1', '4.7.2']
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot ${{ matrix.godot_version }}
        run: |
          curl --fail --location --retry 3 --silent --show-error -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/${{ matrix.godot_version }}-stable/Godot_v${{ matrix.godot_version }}-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v${{ matrix.godot_version }}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import and parse project
        run: godot --headless --editor --path . --quit
      - name: Verify boss second phase, telegraphs, and FX
        run: godot --headless --path . --script res://tests/test_boss_mechanics.gd
      - name: Regression - stages, equipment-free save and abilities
        run: godot --headless --path . --script res://tests/test_game_session.gd
      - name: Frame smoke test
        run: godot --headless --path . --quit-after 180
