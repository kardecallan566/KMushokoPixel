name: Validate game data
on:
  push:
    paths:
      - 'data/**'
      - 'tools/validate_data.py'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'tools/validate_data.py'
      - '.github/workflows/validate-data.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_data.py
