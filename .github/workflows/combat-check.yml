name: CP02 Combat and Pixel Monsters
on:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'project.godot'
      - 'assets/enemies/**'
      - 'tools/validate_combat_data.py'
      - 'tools/generate_monsters.py'
      - 'tests/test_game_session.gd'
      - '.github/workflows/combat-check.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'project.godot'
      - 'assets/enemies/**'
      - 'tools/validate_combat_data.py'
      - 'tools/generate_monsters.py'
      - 'tests/test_game_session.gd'
      - '.github/workflows/combat-check.yml'
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python tools/validate_combat_data.py
      - run: python tools/generate_monsters.py
      - name: Pixel sprite generation is repeatable
        run: git diff --exit-code -- assets/enemies/
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.5.1
        run: |
          curl --fail --location --retry 3 --silent --show-error -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import assets and parse scripts
        run: godot --headless --editor --path . --quit
      - name: Run session progression test
        run: godot --headless --path . --script res://tests/test_game_session.gd
      - name: Smoke test visual scene for 120 frames
        run: godot --headless --path . --quit-after 120