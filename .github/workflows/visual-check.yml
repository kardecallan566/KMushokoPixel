name: CP01A Pixel Art and Godot Smoke Test
on:
  push:
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'tools/generate_assets.py'
      - 'tools/validate_assets.py'
      - 'project.godot'
      - '.github/workflows/visual-check.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'tools/generate_assets.py'
      - 'tools/validate_assets.py'
      - 'project.godot'
      - '.github/workflows/visual-check.yml'
permissions:
  contents: read
jobs:
  visual-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python tools/validate_assets.py
      - run: python tools/generate_assets.py
      - name: Verify original pixel art is reproducible
        run: git diff --exit-code -- assets/
  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.5.1
        run: |
          curl --fail --location --retry 3 --silent --show-error -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import project and parse GDScript
        run: godot --headless --editor --path . --quit
      - name: Load main scene for 12 frames
        run: godot --headless --path . --quit-after 12